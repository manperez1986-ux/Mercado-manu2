<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<title>Mercado Manu - Audio Test</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  background:#eef2fa;
  color:#11142b;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:560px;
  margin:auto;
}

.card{
  background:white;
  padding:18px;
  border-radius:24px;
  margin-bottom:14px;
  box-shadow:0 5px 22px rgba(0,0,0,.08);
}

h1{
  margin:0 0 8px;
}

p{
  line-height:1.45;
}

.mic{
  width:92px;
  height:92px;
  border:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:20px auto;
  font-size:38px;
  color:white;
  background:linear-gradient(135deg,#7209b7,#00b4d8);
  box-shadow:0 8px 28px rgba(114,9,183,.35);
}

.mic.recording{
  background:linear-gradient(135deg,#ff0055,#ff6b35);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

.status{
  text-align:center;
  font-weight:bold;
  color:#0077aa;
  min-height:42px;
}

.row{
  display:flex;
  gap:8px;
}

button.action{
  flex:1;
  border:0;
  padding:14px;
  border-radius:14px;
  font-weight:bold;
  font-size:14px;
}

.stop{
  background:#eeeeF4;
}

.clear{
  background:#fff1e7;
  color:#ba4e00;
}

.audio-box{
  margin-top:12px;
}

audio{
  width:100%;
}

.result-local{
  color:#0077aa;
  font-size:19px;
  font-weight:900;
}

.product{
  margin-top:10px;
  padding:13px;
  border:1px solid #e1e3ec;
  background:#f8f9fc;
  border-radius:14px;
}

.product-name{
  font-weight:900;
  font-size:17px;
}

.price{
  color:#00855a;
  font-weight:900;
  margin-top:4px;
}

.qty{
  color:#7209b7;
  font-weight:bold;
}

.debug{
  white-space:pre-wrap;
  word-break:break-word;
  font-family:monospace;
  font-size:11px;
  background:#11111d;
  color:#d8e5ff;
  padding:12px;
  border-radius:14px;
}

.error{
  color:#d00000;
  font-weight:bold;
}

.ok{
  color:#00855a;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>🎙️ Audio real</h1>

    <p>
      Toca el micrófono, habla normalmente y vuelve a tocarlo para terminar.
      El audio real se enviará a Gemini.
    </p>

    <button
      id="micBtn"
      class="mic"
      onclick="toggleRecording()"
    >
      🎙️
    </button>

    <div id="status" class="status">
      Pulsa el micrófono para empezar.
    </div>

    <div class="row">

      <button
        class="action stop"
        onclick="stopRecording()"
      >
        ⏹️ Detener
      </button>

      <button
        class="action clear"
        onclick="clearAll()"
      >
        🧹 Limpiar
      </button>

    </div>

    <div id="audioBox" class="audio-box"></div>

  </div>


  <div class="card">

    <b>Resultado</b>

    <div id="result" style="margin-top:10px">
      Todavía no hay resultado.
    </div>

  </div>


  <div class="card">

    <b>Diagnóstico</b>

    <div id="debug" class="debug" style="margin-top:10px">
      Esperando...
    </div>

  </div>

</div>


<script>
"use strict";

let mediaRecorder = null;
let audioChunks = [];
let audioBlob = null;
let audioUrl = null;
let stream = null;
let recording = false;

const $ = id => document.getElementById(id);

function debug(msg){
  const t = new Date().toLocaleTimeString();
  $("debug").textContent =
    `[${t}] ${msg}\n` +
    $("debug").textContent;
}

async function toggleRecording(){

  if(recording){
    stopRecording();
    return;
  }

  await startRecording();
}

async function startRecording(){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    const preferredTypes = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus"
    ];

    let mimeType = "";

    for(const type of preferredTypes){

      if(
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(type)
      ){
        mimeType = type;
        break;
      }
    }

    mediaRecorder =
      mimeType
        ? new MediaRecorder(stream,{mimeType})
        : new MediaRecorder(stream);

    audioChunks = [];

    mediaRecorder.ondataavailable = event => {

      if(
        event.data &&
        event.data.size > 0
      ){
        audioChunks.push(event.data);
      }

    };

    mediaRecorder.onstop = async () => {

      audioBlob =
        new Blob(
          audioChunks,
          {
            type:
              mediaRecorder.mimeType ||
              "audio/webm"
          }
        );

      if(audioUrl){
        URL.revokeObjectURL(audioUrl);
      }

      audioUrl =
        URL.createObjectURL(audioBlob);

      $("audioBox").innerHTML = `
        <audio controls src="${audioUrl}"></audio>
      `;

      debug(
        "Audio creado: " +
        audioBlob.type +
        " / " +
        audioBlob.size +
        " bytes"
      );

      stopTracks();

      await sendAudioToServer();
    };

    mediaRecorder.start();

    recording = true;

    $("micBtn")
      .classList
      .add("recording");

    $("micBtn").textContent =
      "⏹️";

    $("status").textContent =
      "🎙️ Grabando... habla normalmente.";

    $("result").innerHTML =
      "Esperando audio...";

    debug(
      "Grabación iniciada: " +
      (mediaRecorder.mimeType || "sin mime")
    );

  }

  catch(error){

    console.error(error);

    $("status").textContent =
      "❌ No se pudo usar el micrófono.";

    debug(
      "ERROR micrófono: " +
      error.message
    );
  }
}

function stopRecording(){

  if(
    !mediaRecorder ||
    mediaRecorder.state === "inactive"
  ){
    return;
  }

  recording = false;

  $("micBtn")
    .classList
    .remove("recording");

  $("micBtn").textContent =
    "🎙️";

  $("status").textContent =
    "⏳ Procesando audio...";

  try{
    mediaRecorder.stop();
  }
  catch(error){
    debug(
      "ERROR stop: " +
      error.message
    );
  }
}

function stopTracks(){

  if(!stream){
    return;
  }

  stream
    .getTracks()
    .forEach(track => track.stop());

  stream = null;
}

async function blobToBase64(blob){

  return new Promise((resolve,reject) => {

    const reader =
      new FileReader();

    reader.onloadend = () => {

      const result =
        String(reader.result || "");

      const base64 =
        result.includes(",")
          ? result.split(",")[1]
          : result;

      resolve(base64);
    };

    reader.onerror = reject;

    reader.readAsDataURL(blob);
  });
}

async function sendAudioToServer(){

  if(!audioBlob){
    return;
  }

  $("status").textContent =
    "🤖 Gemini está escuchando el audio...";

  $("result").innerHTML =
    "Procesando...";

  try{

    const base64 =
      await blobToBase64(audioBlob);

    const response =
      await fetch(
        "/api/parse-audio-shopping",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            audioBase64:base64,
            mimeType:audioBlob.type,
            rate:777.42,
            defaultStore:"GENERAL"
          })
        }
      );

    const data =
      await response.json();

    debug(
      "Servidor HTTP " +
      response.status
    );

    if(!response.ok){

      throw new Error(
        data.error ||
        "Error interpretando audio"
      );
    }

    renderResult(data);

    $("status").textContent =
      "✅ Audio entendido.";

  }

  catch(error){

    console.error(error);

    $("status").textContent =
      "❌ Error procesando audio.";

    $("result").innerHTML =
      '<div class="error">' +
      escapeHTML(error.message) +
      '</div>';

    debug(
      "ERROR servidor: " +
      error.message
    );
  }
}

function renderResult(data){

  let html =
    '<div class="result-local">' +
    '🏪 ' +
    escapeHTML(
      data.local ||
      "GENERAL"
    ) +
    '</div>';

  if(
    !Array.isArray(data.products) ||
    !data.products.length
  ){

    html +=
      '<p class="error">' +
      'No se detectaron productos.' +
      '</p>';

    $("result").innerHTML =
      html;

    return;
  }

  data.products.forEach(product => {

    const qty =
      Number(
        product.cantidad || 1
      );

    const price =
      Number(
        product.precio || 0
      );

    html += `
      <div class="product">

        <div class="product-name">
          🛒 ${escapeHTML(product.nombre)}
        </div>

        <div class="qty">
          Cantidad: ${qty}
        </div>

        <div class="price">
          ${
            product.moneda === "USD"
              ? "$" + price.toFixed(2)
              : price.toFixed(2) + " Bs"
          }
        </div>

        <div style="font-size:11px;margin-top:4px;color:#666">
          ${escapeHTML(product.tipoPrecio || "UNITARIO")}
        </div>

      </div>
    `;
  });

  $("result").innerHTML =
    html;
}

function clearAll(){

  if(recording){
    stopRecording();
  }

  stopTracks();

  audioChunks = [];
  audioBlob = null;

  if(audioUrl){
    URL.revokeObjectURL(audioUrl);
    audioUrl = null;
  }

  $("audioBox").innerHTML =
    "";

  $("result").innerHTML =
    "Todavía no hay resultado.";

  $("status").textContent =
    "Pulsa el micrófono para empezar.";

  debug(
    "Prueba limpiada."
  );
}

function escapeHTML(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
